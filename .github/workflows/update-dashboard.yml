name: Update Deployment Dashboard

on:
  schedule:
    # Runs every day at 06:00 UTC. Adjust the cron value to change the time.
    - cron: "0 6 * * *"
  workflow_dispatch: {}
    # ^ This adds a "Run workflow" button on the Actions tab in GitHub,
    #   giving you a one-click manual refresh whenever you need it.

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull latest Jira data and regenerate dashboard
        env:
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python3 scripts/generate_dashboard.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          git add index.html data.json
          git diff --quiet --cached || git commit -m "Auto-refresh deployment dashboard"
          git push
